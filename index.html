<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Garage Session</title>
<style>body{margin:0;background:#12171c;color:#f4f1ea;font-family:Arial,sans-serif}button,input{font-family:inherit}.wrap{max-width:640px;margin:0 auto;padding:18px}.kicker{color:#9aa6b2;font-size:13px;letter-spacing:.08em;text-transform:uppercase}h1{font-size:28px;margin:6px 0 8px}.note{color:#9aa6b2;margin:0 0 14px}.pick{width:100%;height:64px;border:0;border-radius:14px;background:#24303a;color:#f4f1ea;font-size:20px;font-weight:800;margin:0 0 10px;text-align:left;padding:0 16px}.pick small{display:block;font-size:13px;font-weight:600;color:#9aa6b2}.card{background:#1c242c;border:1px solid #2c3844;border-radius:18px;padding:18px}.set{color:#e0a106;font-weight:700;text-transform:uppercase;font-size:13px}.exercise{font-size:32px;margin:8px 0}.target{color:#9aa6b2}.weight{font-size:64px;font-weight:700}.row{display:flex;align-items:center;justify-content:space-between}.step{width:72px;height:72px;border:0;border-radius:14px;background:#2a3541;color:#fff;font-size:28px;font-weight:700}.reps{width:100%;margin-top:8px;background:#fff3c4;color:#102a56;border:0;border-radius:10px;font-size:42px;font-weight:700;text-align:center;padding:8px}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.pad button{height:58px;border:0;border-radius:12px;background:#24303a;color:#fff;font-size:22px;font-weight:700}.confirm{margin-top:14px;width:100%;height:64px;border:0;border-radius:14px;background:#e0a106;color:#1c1403;font-size:20px;font-weight:800}.link{margin-top:8px;width:100%;height:48px;border-radius:12px;border:1px solid #2c3844;background:transparent;color:#f4f1ea;font-size:16px}.overlay{position:fixed;inset:0;background:rgba(8,10,12,.86);display:flex;align-items:flex-end;justify-content:center;padding:16px}.sheet{width:min(560px,100%);background:#1c242c;border-radius:20px;padding:22px 18px;border:1px solid #2c3844}.timer{font-size:84px;font-weight:800;text-align:center}.hidden{display:none!important}.go{width:100%;height:56px;border:0;border-radius:12px;background:#e0a106;color:#1c1403;font-size:18px;font-weight:800}</style></head>
<body>
<div class="wrap" id="chooser">
  <div class="kicker">Garage session</div>
  <h1>Which workout?</h1>
  <p class="note">Tap the one you are doing. Tuesday is Back, but any of these can be started.</p>
  <button class="pick" type="button" data-name="Chest">Chest<small>Monday · incline press, bench, squeeze press</small></button>
  <button class="pick" type="button" data-name="Back">Back<small>Tuesday · rows and pullover</small></button>
  <button class="pick" type="button" data-name="Legs">Legs<small>Thursday · squat, deadlift, single-leg squat</small></button>
  <button class="pick" type="button" data-name="Shoulders & Arms">Shoulders and arms<small>Friday · press, raise, curl, extension</small></button>
</div>
<div class="wrap hidden" id="session">
  <div class="kicker" id="kicker">Session</div>
  <h1 id="title">Workout</h1>
  <section class="card"><div class="set" id="setLabel">Set</div><div class="exercise" id="exercise">—</div><div class="target" id="target">8–12 controlled reps. Full range, no rush.</div><div class="row"><button class="step" id="minus" type="button">−5</button><div class="weight" id="weight">—</div><button class="step" id="plus" type="button">+5</button></div><input class="reps" id="reps" inputmode="numeric" placeholder="Reps"><div class="pad" id="pad"></div><button class="confirm" id="confirm" type="button">Confirm reps</button><button class="link" id="changeBtn" type="button">Change workout</button></section>
</div>
<div class="overlay hidden" id="restOverlay"><div class="sheet"><div class="kicker">Next lift begins in</div><div class="timer" id="timer">2:00</div><h1 id="nextName">Next</h1><button class="go" id="liftNow" type="button">Start lift now</button></div></div>
<script>
const PROGRAM={Chest:{exercises:[['Incline Dumbbell Press',3,150],['Dumbbell Bench Press',3,120],['Dumbbell Squeeze Press',2,90]]},Back:{exercises:[['Chest-Supported Dumbbell Row',3,120],['Single-Arm Dumbbell Row',3,90],['Dumbbell Pullover',2,90]]},Legs:{exercises:[['Goblet Squat',3,120],['Dumbbell Romanian Deadlift',3,120],['Dumbbell Single-Leg Squat',2,90]]},'Shoulders & Arms':{exercises:[['Seated Dumbbell Press',3,120],['Dumbbell Lateral Raise',2,75],['Dumbbell Curl',2,75],['Overhead Triceps Extension',1,75]]}};
const $=id=>document.getElementById(id);
let state=JSON.parse(localStorage.getItem('garage-session-v1')||'null')||{started:new Date().toISOString().slice(0,10),sets:[],weights:{}};
let queue=[],index=0,timerId=null,remaining=0,sessionName='';
function save(){localStorage.setItem('garage-session-v1',JSON.stringify(state));}
function suggested(name){const rows=state.sets.filter(s=>s.exercise===name);if(!rows.length)return state.weights[name]||0;const lastDate=rows[rows.length-1].date;const last=rows.filter(s=>s.date===lastDate);const hit=last.length&&last.every(s=>s.reps>=12);return hit?last[last.length-1].weight+5:last[last.length-1].weight;}
function build(name){const list=[];PROGRAM[name].exercises.forEach(ex=>{for(let s=1;s<=ex[1];s++)list.push({name:ex[0],set:s,sets:ex[1],rest:ex[2],session:name});});return list;}
function render(){const item=queue[index];if(!item){$('title').textContent='Done';return;}$('kicker').textContent=item.session;$('setLabel').textContent='Set '+item.set+' of '+item.sets;$('exercise').textContent=item.name;$('weight').textContent=(item.weight||'—')+' lb';$('reps').value='';}
function start(name){sessionName=name;queue=build(name);index=0;queue.forEach(item=>item.weight=suggested(item.name));$('chooser').classList.add('hidden');$('session').classList.remove('hidden');$('title').textContent=name;render();}
function confirmReps(){const item=queue[index];const reps=parseInt($('reps').value,10);if(!reps)return;if(!item.weight){$('target').textContent='Set the weight with +5 first.';return;}state.sets.push({date:new Date().toISOString().slice(0,10),session:item.session,exercise:item.name,set:item.set,weight:item.weight,reps});state.weights[item.name]=item.weight;save();index++;if(index>=queue.length){$('title').textContent='Saved on this iPad';return;}const next=queue[index];$('nextName').textContent=next.name+' · set '+next.set;$('restOverlay').classList.remove('hidden');remaining=queue[index-1].rest;tick();timerId=setInterval(tick,1000);}
function tick(){const m=Math.floor(remaining/60),s=remaining%60;$('timer').textContent=m+':'+String(s).padStart(2,'0');if(remaining<=0){clearInterval(timerId);timerId=null;$('timer').textContent='Lift';return;}remaining--;}
$('pad').innerHTML=[1,2,3,4,5,6,7,8,9,'C',0,'⌫'].map(k=>'<button type="button" data-k="'+k+'">'+k+'</button>').join('');
$('pad').onclick=e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.k;if(k==='C')$('reps').value='';else if(k==='⌫')$('reps').value=$('reps').value.slice(0,-1);else if($('reps').value.length<2)$('reps').value+=k;};
document.getElementById('chooser').onclick=e=>{const b=e.target.closest('button');if(b&&b.dataset.name)start(b.dataset.name);};
$('changeBtn').onclick=()=>{$('session').classList.add('hidden');$('chooser').classList.remove('hidden');$('restOverlay').classList.add('hidden');if(timerId)clearInterval(timerId);};
$('minus').onclick=()=>{const item=queue[index];if(!item)return;item.weight=Math.max(0,(item.weight||0)-5);render();};
$('plus').onclick=()=>{const item=queue[index];if(!item)return;item.weight=(item.weight||0)+5;render();};
$('confirm').onclick=confirmReps;
$('liftNow').onclick=()=>{if(timerId)clearInterval(timerId);$('restOverlay').classList.add('hidden');render();};
</script></body></html>
