<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Garage Session</title>
<style>body{margin:0;background:#0b3a73;color:#f4f8fd;font-family:Arial,sans-serif;min-height:100vh}button,input{font-family:inherit}.wrap{max-width:640px;margin:0 auto;padding:18px}.kicker{color:#d6ebff;font-size:13px;letter-spacing:.08em;text-transform:uppercase}h1{font-size:28px;margin:6px 0 8px}.note{color:#d6ebff;margin:0 0 14px}.pick{width:100%;height:64px;border:0;border-radius:14px;background:#2f7de1;color:#fff;font-size:20px;font-weight:800;margin:0 0 10px;text-align:left;padding:0 16px}.pick small{display:block;font-size:13px;font-weight:600;color:#e7f3ff}.card{background:#1457a8;border:1px solid #8ec5ff;border-radius:18px;padding:18px;margin-bottom:14px}.set{color:#d6ebff;font-weight:700;text-transform:uppercase;font-size:13px}.exercise{font-size:32px;margin:8px 0}.target{color:#d6ebff}.weight{font-size:64px;font-weight:700}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.step{width:72px;height:72px;border:0;border-radius:14px;background:#3b8ef0;color:#fff;font-size:28px;font-weight:700}.reps,.daily input,.editrow input,.namebox{background:#e7f3ff;color:#0d2c52;border:0;border-radius:10px;font-weight:700}.reps{width:100%;margin-top:8px;font-size:42px;text-align:center;padding:8px}.daily input{width:100%;font-size:22px;padding:10px;margin-top:6px}.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.pad button{height:58px;border:0;border-radius:12px;background:#2f7de1;color:#fff;font-size:22px;font-weight:700}.confirm,.go{width:100%;border:0;border-radius:14px;background:#9fd0ff;color:#06203f;font-weight:800}.confirm{margin-top:14px;height:64px;font-size:20px}.go{height:56px;font-size:18px;margin-top:8px}.link{margin-top:8px;width:100%;height:48px;border-radius:12px;border:1px solid #d6ebff;background:transparent;color:#fff;font-size:16px}.overlay{position:fixed;inset:0;background:rgba(6,24,58,.8);display:flex;align-items:flex-end;justify-content:center;padding:16px}.sheet{width:min(560px,100%);background:#1457a8;border-radius:20px;padding:22px 18px;border:1px solid #9fd0ff;max-height:86vh;overflow:auto}.timer{font-size:84px;font-weight:800;text-align:center}.hidden{display:none!important}.entry{border-bottom:1px solid #8ec5ff;padding:10px 0}.entry b{display:block}.editrow{display:flex;gap:8px;margin-top:8px}.editrow input{width:72px;text-align:center;font-size:16px;padding:8px}.namebox{flex:1;font-size:16px;padding:8px}.editrow button{border:0;border-radius:8px;padding:8px 10px;font-weight:700}.save{background:#1f7a4d;color:#fff}.del{background:#8c3a3a;color:#fff}.dayblock{margin:14px 0}.dayblock h2{font-size:18px;margin:0 0 8px}label{display:block;color:#d6ebff;font-size:13px;margin-top:8px}
.chart-wrap{margin:16px 0;background:#0b3a73;border-radius:12px;padding:12px}
select{width:100%;font-size:18px;padding:10px;border-radius:10px;background:#e7f3ff;color:#0d2c52;font-weight:700;border:0;margin:6px 0}
.updown{display:flex;flex-direction:column;gap:2px}
.updown button{width:36px;height:28px;padding:0;font-size:16px;background:#3b8ef0;color:#fff;border:0;border-radius:6px}
</style><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="wrap" id="chooser">
  <div class="kicker">Garage session</div>
  <h1>Which workout?</h1>
  <p class="note">Allow notifications when asked. Tap the Lift alert to come back. If you leave the app, also start the Clock timer. This page cannot open itself.</p>
  <section class="card daily">
    <div class="set">Today, optional</div>
    <label for="bodyWeight">Body weight (lb)</label>
    <input id="bodyWeight" inputmode="decimal" placeholder="Skip if you want">
    <label for="steps">Steps</label>
    <input id="steps" inputmode="numeric" placeholder="Skip if you want">
    <button class="confirm" id="saveDaily" type="button">Save weigh-in and steps</button>
    <p class="note" id="dailyNote"></p>
  </section>
  <button class="pick" type="button" data-name="Chest">Chest<small>Incline press, bench, squeeze press</small></button>
  <button class="pick" type="button" data-name="Back">Back<small>Rows and pullover</small></button>
  <button class="pick" type="button" data-name="Legs">Legs<small>Squat, deadlift, single-leg squat</small></button>
  <button class="pick" type="button" data-name="Shoulders & Arms">Shoulders and arms<small>Press, raise, curl, extension</small></button>
  <button class="link" id="logBtn" type="button">Log</button>
  <button class="link" id="editBtn" type="button">Edit exercises</button>
  <button class="link" id="progressBtn" type="button">Progress</button>
</div>
<!-- truncated for display; full content includes session, overlays, and full script with reordering and charts -->
</body></html>
